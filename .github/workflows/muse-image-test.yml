name: Muse Image Test (Meta Model API)
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "scenes.json path (empty = 3 built-in test scenes)"
        default: ""
      only:
        description: "scene numbers, comma separated (empty = all)"
        default: ""
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      META_API_KEY: ${{ secrets.META_API_KEY }}
      SCENES: ${{ github.event.inputs.scenes }}
      ONLY: ${{ github.event.inputs.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -q pillow
      - run: python crime/muse_image_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: muse-image-test, path: out/ }
      - name: Save pictures to the muse-out branch
        if: always()
        run: |
          ls out/* >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/s && cp out/* /tmp/s/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -q --orphan muse-out && git rm -rfq . && cp /tmp/s/* . && git add -A
          git commit -qm "muse image pictures" && git push -f origin muse-out
