name: Crime CPU Motion Test (2.5D + LTX, free CPU)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "parallax, ltx or both"
        default: "both"
      imgs:
        description: "comma separated image paths in the repo"
        default: "crime/hftest/test1.jpg,crime/hftest/test2.jpg"
      ltx_imgs:
        description: "pictures for the slow LTX clip (keep to 1)"
        default: "crime/hftest/test1.jpg"
      steps:
        description: "LTX steps"
        default: "30"
permissions:
  contents: write
jobs:
  parallax:
    if: github.event.inputs.mode != 'ltx'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch && pip install -q transformers opencv-python-headless pillow numpy
      - run: python crime/parallax.py
        env: { IMGS: "${{ github.event.inputs.imgs }}", OUT: out }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: parallax, path: out/ }
  ltx:
    if: github.event.inputs.mode != 'parallax'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space for the model download
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch && pip install -q diffusers transformers accelerate sentencepiece imageio imageio-ffmpeg pillow
      - run: python crime/ltx_cpu.py
        env: { IMGS: "${{ github.event.inputs.ltx_imgs }}", STEPS: "${{ github.event.inputs.steps }}", OUT: out, HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ltx, path: out/ }
  save:
    needs: [parallax, ltx]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: got }
      - name: Save clips to the cpumotion-out branch
        run: |
          mkdir -p /tmp/s && find got -type f -exec cp {} /tmp/s/ \; ; ls -la /tmp/s
          [ "$(ls -A /tmp/s)" ] || exit 0
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -q --orphan cpumotion-out && git rm -rfq . && cp /tmp/s/* . && git add -A
          git commit -qm "cpu motion test" && git push -f origin cpumotion-out
