name: Crime Description Replace
on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "YouTube video ids, comma separated"
        required: true
      old:
        description: "text to replace"
        required: true
      new:
        description: "new text"
        required: true
permissions:
  contents: read
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      VIDEO_IDS: ${{ github.event.inputs.video_ids }}
      OLD: ${{ github.event.inputs.old }}
      NEW: ${{ github.event.inputs.new }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python crime/desc_replace.py
