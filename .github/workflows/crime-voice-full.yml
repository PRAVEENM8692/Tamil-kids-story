name: Crime Story Full Voice
on:
  workflow_dispatch:
    inputs:
      case:
        description: "case folder name under crime/ (default alavandar)"
        default: "alavandar"
      only:
        description: "Section numbers to make, comma separated (empty = all)"
        default: ""
      narrator:
        description: "myvoice = owner's own AI voice (default), gemini = Charon"
        default: "myvoice"
      expressive:
        description: "1 = Gemini with per-section expressive style directions"
        default: ""
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MYVOICE_KEY: ${{ secrets.MYVOICE_KEY }}
      NARRATOR: ${{ github.event.inputs.narrator || 'myvoice' }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      EXPRESSIVE: ${{ github.event.inputs.expressive }}
      ONLY: ${{ github.event.inputs.only }}
      CASE: ${{ github.event.inputs.case }}
      SCRIPT: crime/${{ github.event.inputs.case }}/script.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install requests numpy
      - name: My own AI voice (decrypt reference, install voice tools)
        if: ${{ (github.event.inputs.narrator || 'myvoice') == 'myvoice' }}
        run: bash crime/myvoice_setup.sh
      - run: python crime/voice_full.py
      - name: Save the voice files to the voice-${CASE} branch
        run: |
          mkdir -p /tmp/s && cp out/* /tmp/s/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan voice-${CASE} && git rm -rfq . && cp /tmp/s/* . && git add *.mp3 durations.json
          git commit -qm "${CASE} voice" && git push -f origin voice-${CASE}
