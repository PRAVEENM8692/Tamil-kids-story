name: Crime Image Model Test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow requests
      - run: python crime/model_test.py
      - name: Save to modeltest-out
        if: always()
        run: |
          ls out/* >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/s && cp out/* /tmp/s/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -q --orphan modeltest-out && git rm -rfq . && cp /tmp/s/* . && git add -A
          git commit -qm "model test" && git push -f origin modeltest-out
